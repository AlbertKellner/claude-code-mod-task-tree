<svg viewBox="0 0 680 925" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif"><title>Proposta visual do painel task-tree</title><desc>Referência visual do painel: cabeçalho com barra e chips (em andamento, aguardando, interrompida, sessão ativa com ícone de ramificação), guias vetoriais ligando as tarefas, clique só no ícone de progresso para recolher ou abrir, sem controle visível (num nome cortado, a dica com o nome completo cobre o nome, depois do ícone) (sem coluna ▾/▸, as linhas começam na borda esquerda; linha recolhida ganha " ⋯" após o nome), tarefa interrompida, cartão cinza da sessão filha (nome da sessão como rótulo solto, 12 px cinza em negrito, com ⑂ à esquerda do nome, no lugar do ícone de tarefa, e que recolhe o cartão; palavra de estado logo depois do nome e anel de contexto sozinho na ponta direita da linha do rótulo, com o modelo e o esforço da sessão em cinza de 11 px terminando 8 px à esquerda dele, no centro da caixa do botão que abre a sessão (não preso à coluna do tempo), em todo cartão da sessão (parado, concluído ou de rodada antiga) com o último % publicado, e sem anel só quando nenhum % foi publicado; o anel só aparece no cartão da filha, não nas linhas da tarefa-mãe nem do pedido; sem ícone, barra, contagem nem tempo; a guia da tarefa da principal desce e entra no cartão, terminando na borda esquerda à altura do rótulo; as tarefas começam na linha de baixo como raízes; um turno com mais de uma tarefa de nível 1 ganha a linha do pedido, sem ↩, com as tarefas ligadas abaixo dela por guia; com um só nível 1, sem essa linha), aviso de espera, um cartão por mensagem enviada à filha ocupada (o cartão 0 no ponto original, o cartão k sob a tarefa que mandou a mensagem k; só o primeiro mostra a espera), envelope azul na tarefa cuja mensagem a filha ainda não leu (recebida a mensagem, a tarefa de envio sem subtarefa aberta fecha sozinha com ✓), filha parada com tarefa aberta (ícone ◷, "parada", cartão aberto com as tarefas do plano dela), linha ↩ com a resposta de cada turno concluído da filha depois das tarefas do cartão (ícone cinza, texto esmaecido com o resumo tipo manchete de até 120 caracteres (o que mudou e o resultado; se não couber na largura, cortado com "…" e com a dica) escrito pela própria sessão no done; sem resumo, só "resposta", nunca o texto cortado; a resposta inteira só na dica, sem barra, contagem nem tempo, fora do d/n; nenhuma enquanto o turno roda; no painel principal, cada grupo de mensagem também termina, depois das suas tarefas de nível 1, com uma linha ↩ da resposta do turno concluído, exceto o grupo com cartão de sessão filha, em que a resposta que vale é a das filhas, nos cartões), tarefas na ordem do plano, seção Concluídas aberta, grupo de subagente interrompido aberto (nada recolhe sozinho; só o clique do usuário no ícone recolhe). Sem fundo pontilhado.</desc>
