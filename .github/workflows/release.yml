name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    # Só PR mergeado: PR fechado sem merge não gera release.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Ler versão do plugin
        id: version
        run: |
          v=$(jq -r .version task-tree/.claude-plugin/plugin.json)
          if [ -z "$v" ] || [ "$v" = "null" ]; then
            echo "::error::Campo version ausente em task-tree/.claude-plugin/plugin.json"
            exit 1
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG já existe; a versão não mudou neste PR."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$SHA" \
            --title "task-tree $TAG" \
            --generate-notes
