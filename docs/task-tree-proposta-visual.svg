<svg viewBox="0 0 680 830" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif"><title>Proposta visual do painel task-tree</title><desc>Referência visual do painel: cabeçalho com barra e chips (em andamento, aguardando, interrompida, sessão ativa com ícone de ramificação), guias vetoriais ligando as tarefas, setas de abrir e recolher, tarefa interrompida, cartão cinza da sessão filha, aviso de espera, um cartão por mensagem enviada à filha ocupada (o cartão 0 no ponto original, o cartão k sob a tarefa que mandou a mensagem k; só o primeiro mostra a espera), envelope azul na tarefa cuja mensagem a filha ainda não leu, filha parada com tarefa aberta (ícone ◷, "parada", cartão aberto com as tarefas do plano dela), tarefas na ordem do plano, seção Concluídas aberta, grupo de subagente interrompido aberto (nada recolhe sozinho; só o ▾/▸ do usuário recolhe). Sem fundo pontilhado.</desc>
<style>.bg{fill:#1a1a19}.t{fill:#e8e6dc;font-size:14px}.th{fill:#e8e6dc;font-size:16px;font-weight:500}.ts{fill:#b4b2a9;font-size:12px}.card{fill:#444441;stroke:#888780}@media (prefers-color-scheme: light){.bg{fill:#ffffff}.t,.th{fill:#2c2c2a}.ts{fill:#5f5e5a}.card{fill:#f1efe8;stroke:#b4b2a9}}</style>
