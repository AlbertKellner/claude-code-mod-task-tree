<svg viewBox="0 0 680 830" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif"><title>Proposta visual do painel task-tree</title><desc>Referência visual do painel: cabeçalho com barra e chips (em andamento, aguardando, interrompida, sessão ativa com ícone de ramificação), guias vetoriais ligando as tarefas, clique só no ícone de progresso para recolher ou abrir, sem controle visível (num nome cortado, a dica com o nome completo cobre o nome, depois do ícone) (sem coluna ▾/▸, as linhas começam na borda esquerda; linha recolhida ganha " ⋯" após o nome), tarefa interrompida, cartão cinza da sessão filha (nome da sessão como rótulo solto, 12 px cinza em negrito, com ⑂ à esquerda do nome, no lugar do ícone de tarefa, e que recolhe o cartão; anel de contexto e palavra de estado à direita; sem ícone, barra, contagem nem tempo; a guia da tarefa da principal desce e entra no cartão, terminando na borda esquerda à altura do rótulo; as tarefas começam na linha de baixo como raízes), aviso de espera, um cartão por mensagem enviada à filha ocupada (o cartão 0 no ponto original, o cartão k sob a tarefa que mandou a mensagem k; só o primeiro mostra a espera), envelope azul na tarefa cuja mensagem a filha ainda não leu (recebida a mensagem, a tarefa de envio sem subtarefa aberta fecha sozinha com ✓), filha parada com tarefa aberta (ícone ◷, "parada", cartão aberto com as tarefas do plano dela), tarefas na ordem do plano, seção Concluídas aberta, grupo de subagente interrompido aberto (nada recolhe sozinho; só o clique do usuário no ícone recolhe). Sem fundo pontilhado.</desc>
